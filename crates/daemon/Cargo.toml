[package]
name = "ferroseek-daemon"
description = "FerroSeek daemon: indexing engine, D-Bus file search, opening and control"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "ferroseekd"
path = "src/main.rs"

[dependencies]
ferroseek-desktop.workspace = true
ferroseek-index.workspace = true
ferroseek-engine.workspace = true
zbus.workspace = true
zruntime = { version = "0.2", default-features = false, features = ["unblock"] }
libc.workspace = true
log.workspace = true

[dev-dependencies]
tempfile.workspace = true
