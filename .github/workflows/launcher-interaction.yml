name: Launcher interaction
on:
  pull_request:
    paths:
      - 'crates/launcher/**'
      - 'crates/daemon/**'
      - 'crates/index/**'
      - 'crates/engine/**'
      - 'crates/config/**'
      - 'crates/desktop/**'
      - 'tests/launcher-*'
      - 'scripts/verify-launcher-report.py'
      - '.github/workflows/launcher-interaction.yml'
      - 'Cargo.lock'
      - 'Cargo.toml'
  workflow_dispatch:
jobs:
  keyboard-and-latency:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        profile: [us-1x, fr-1x, us-1.5x]
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated graphical test dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1 libxkbcommon-dev dbus libglib2.0-bin kwin-wayland kde-spectacle xvfb xauth qtwayland5 fonts-dejavu-core breeze-icon-theme libwayland-dev libwayland-bin plasma-wayland-protocols python3-pyqt5 python3-gi gir1.2-gtk-4.0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo build --release --locked -p ferroseek-launcher -p ferroseek-daemon
      - name: Exercise real keyboard input in virtual KWin
        run: |
          export XDG_RUNTIME_DIR=$(mktemp -d)
          export LIBGL_ALWAYS_SOFTWARE=1
          export QT_LOGGING_RULES='*.debug=false'
          export FERROSEEK_SMOKE_INTERACTION=1
          export FERROSEEK_SMOKE_MODE=all
          export FERROSEEK_SMOKE_PROFILE=${{ matrix.profile }}
          xvfb-run -a tests/launcher-smoke.sh target/release "$RUNNER_TEMP/launcher-interaction"
      - name: Verify samples against original process logs
        run: python3 scripts/verify-launcher-report.py "$RUNNER_TEMP/launcher-interaction" --binary target/release/ferroseek-launcher
      - name: Exercise screenshot-only smoke mode
        run: |
          export LIBGL_ALWAYS_SOFTWARE=1
          export QT_LOGGING_RULES='*.debug=false'
          export FERROSEEK_SMOKE_INTERACTION=0
          export FERROSEEK_SMOKE_PROFILE=${{ matrix.profile }}
          xvfb-run -a tests/launcher-smoke.sh target/release "$RUNNER_TEMP/launcher-interaction/screenshots"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launcher-interaction-${{ matrix.profile }}
          path: ${{ runner.temp }}/launcher-interaction
