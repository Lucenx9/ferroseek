name: Launcher interaction
on:
  workflow_call:
  workflow_dispatch:
jobs:
  keyboard-and-latency:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        profile: [us-1x, fr-1x, us-1.5x, us-multi]
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated graphical test dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1 libxkbcommon-dev dbus libglib2.0-bin kwin-wayland kde-spectacle xvfb xauth qtwayland5 fonts-dejavu-core breeze-icon-theme libwayland-dev libwayland-bin plasma-wayland-protocols python3-pyqt5 python3-gi gir1.2-gtk-4.0
      - name: Install isolated clipboard test tools
        if: matrix.profile == 'us-multi'
        run: sudo apt-get install -y --no-install-recommends wl-clipboard
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Exercise real keyboard input in virtual KWin
        run: scripts/check launcher "${{ matrix.profile }}" "$RUNNER_TEMP/launcher-interaction"
      - name: Exercise constrained layout in virtual KWin
        if: matrix.profile == 'us-1x' || matrix.profile == 'us-1.5x'
        run: |
          export LIBGL_ALWAYS_SOFTWARE=1
          export QT_LOGGING_RULES='*.debug=false'
          export FERROSEEK_SMOKE_INTERACTION=1
          export FERROSEEK_SMOKE_MODE=all
          if [[ '${{ matrix.profile }}' == 'us-1x' ]]; then
            export FERROSEEK_SMOKE_PROFILE=us-layout-1x
          else
            export FERROSEEK_SMOKE_PROFILE=us-layout-1.5x
          fi
          xvfb-run -a tests/launcher-smoke.sh target/release "$RUNNER_TEMP/launcher-interaction/layout"
          if [[ '${{ matrix.profile }}' == 'us-1x' ]]; then
            FERROSEEK_SMOKE_PROFILE=us-short-1x xvfb-run -a tests/launcher-smoke.sh target/release "$RUNNER_TEMP/launcher-interaction/short"
          fi
      - name: Exercise screenshot-only smoke mode
        if: matrix.profile != 'us-multi'
        run: |
          export LIBGL_ALWAYS_SOFTWARE=1
          export QT_LOGGING_RULES='*.debug=false'
          export FERROSEEK_SMOKE_INTERACTION=0
          export FERROSEEK_SMOKE_PROFILE=${{ matrix.profile }}
          xvfb-run -a tests/launcher-smoke.sh target/release "$RUNNER_TEMP/launcher-interaction/screenshots"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launcher-interaction-${{ matrix.profile }}
          path: ${{ runner.temp }}/launcher-interaction
