# SPDX-License-Identifier: GPL-3.0-or-later
name: CI
on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install test dependencies (D-Bus for the smoke test)
        run: sudo apt-get update && sudo apt-get install -y dbus libglib2.0-bin
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked --workspace
      - run: python3 tests/install-smoke.py
      - run: python3 tests/package-smoke.py
      - run: python3 tests/benchmark-smoke.py
      - run: python3 tests/verify-index-smoke.py
      - name: MCP stdio smoke test
        run: python3 tests/mcp-smoke.py target/release/ferroseek-mcp target/release/ferroseek
      - name: MCP discovery evaluation harness (offline)
        run: python3 tests/mcp-discovery-smoke.py
      - name: D-Bus smoke test (private session bus)
        run: tests/dbus-smoke.sh target/release/ferroseekd
      - name: Benchmark smoke run (10k files)
        run: target/release/ferroseek-bench --files 10000 --work "$RUNNER_TEMP/bench" > bench.md && cat bench.md

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - run: cargo check --workspace --all-targets --locked
