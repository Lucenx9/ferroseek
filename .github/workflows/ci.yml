# SPDX-License-Identifier: GPL-3.0-or-later
name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install test dependencies (D-Bus for the smoke test; xkbcommon for the launcher build)
        run: sudo apt-get update && sudo apt-get install -y dbus libglib2.0-bin libxkbcommon-dev
      - run: scripts/check workspace
      - run: scripts/check upgrade

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - name: Install build dependencies (xkbcommon for the launcher)
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev
      - run: scripts/check msrv

  launcher-scope:
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.scope.outputs.needed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          needed=true
          if [[ "$EVENT" == pull_request ]]; then
            needed=$(scripts/check launcher-needed HEAD^1 HEAD)
          elif git cat-file -e "$BEFORE^{commit}"; then
            needed=$(scripts/check launcher-needed "$BEFORE" HEAD)
          fi
          echo "needed=$needed" >> "$GITHUB_OUTPUT"

  launcher:
    needs: launcher-scope
    if: needs.launcher-scope.outputs.needed == 'true'
    uses: ./.github/workflows/launcher-interaction.yml

  check:
    if: always()
    needs: [workspace, msrv, launcher-scope, launcher]
    runs-on: ubuntu-latest
    steps:
      - name: Require all applicable checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -e '
            .workspace.result == "success" and .msrv.result == "success" and
            .["launcher-scope"].result == "success" and
            ((.["launcher-scope"].outputs.needed == "false" and .launcher.result == "skipped") or
             (.["launcher-scope"].outputs.needed == "true" and .launcher.result == "success"))
          ' <<< "$RESULTS"
