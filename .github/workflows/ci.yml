# SPDX-License-Identifier: GPL-3.0-or-later
name: CI
on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install test dependencies (D-Bus for the smoke test)
        run: sudo apt-get update && sudo apt-get install -y dbus libglib2.0-bin
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p ferroseek-daemon -p ferroseek-cli
      - name: D-Bus smoke test (private session bus)
        run: tests/dbus-smoke.sh target/release/ferroseekd
      - name: Benchmark smoke run (10k files)
        run: target/release/ferroseek-bench --files 10000 --work "$RUNNER_TEMP/bench" > bench.md && cat bench.md
