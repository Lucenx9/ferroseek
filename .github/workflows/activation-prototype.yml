# SPDX-License-Identifier: GPL-3.0-or-later
name: Activation context prototype
on:
  push:
    branches: [prototype/launcher-activation-context]
jobs:
  shared-wayland-connection:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated graphical test dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxkbcommon-dev dbus libglib2.0-bin kwin-wayland kde-spectacle xvfb xauth qtwayland5 fonts-dejavu-core libwayland-dev libwayland-bin plasma-wayland-protocols python3-pyqt5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Build disposable probe and isolated daemon
        run: |
          cargo build --release --locked -p ferroseek-launcher --example activation-context-prototype
          cargo build --release --locked -p ferroseek-daemon
      - name: Request activation context twice after real Enter input
        run: |
          export XDG_RUNTIME_DIR=$(mktemp -d)
          export LIBGL_ALWAYS_SOFTWARE=1
          export QT_LOGGING_RULES='*.debug=false'
          export FERROSEEK_SMOKE_INTERACTION=1
          xvfb-run -a tests/launcher-smoke.sh target/release target/activation-prototype
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: activation-context-prototype
          path: target/activation-prototype
